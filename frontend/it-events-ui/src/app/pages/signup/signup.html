<main class="auth-page">
  <section class="auth-card wide">
    <h1>Create your account</h1>
    <p class="subtitle">Join Tunisia IT Events</p>

    <div class="toggle">
      <button type="button" [class.active]="role() === 'user'" (click)="setRole('user')">Participant</button>
      <button type="button" [class.active]="role() === 'organizer'" (click)="setRole('organizer')">Organizer</button>
    </div>

    @if (errorMessage()) {
      <div class="alert error">{{ errorMessage() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="grid">
        <label>Last name
          <input formControlName="lastName" autocomplete="family-name" />
          @if (showError('lastName')) { <small class="err">{{ message('lastName') }}</small> }
        </label>

        <label>First name
          <input formControlName="firstName" autocomplete="given-name" />
          @if (showError('firstName')) { <small class="err">{{ message('firstName') }}</small> }
        </label>
      </div>

      <label>Email
        <input type="email" formControlName="email" autocomplete="email" />
        @if (showError('email')) { <small class="err">{{ message('email') }}</small> }
      </label>

      <div class="grid">
        <label>Password
          <input type="password" formControlName="password" autocomplete="new-password" />
          @if (showError('password')) { <small class="err">{{ message('password') }}</small> }
        </label>

        <label>Phone (8 digits)
          <input formControlName="phoneNumber" inputmode="numeric" maxlength="8" autocomplete="tel" />
          @if (showError('phoneNumber')) { <small class="err">{{ message('phoneNumber') }}</small> }
        </label>
      </div>

      @if (role() === 'user') {
        <div class="grid">
          <label>Occupation
            <select formControlName="occupation">
              @for (o of occupations; track o) {
                <option [value]="o">{{ o }}</option>
              }
            </select>
          </label>

          <label>Institution
            <input formControlName="institution" />
            @if (showError('institution')) { <small class="err">{{ message('institution') }}</small> }
          </label>
        </div>
      } @else {
        <label>Organization name
          <input formControlName="organizationName" />
          @if (showError('organizationName')) { <small class="err">{{ message('organizationName') }}</small> }
        </label>

        <label>Description
          <textarea rows="3" formControlName="description"></textarea>
          @if (showError('description')) { <small class="err">{{ message('description') }}</small> }
        </label>

        <div class="grid">
          <label>Website (optional)
            <input formControlName="website" placeholder="https://" />
          </label>

          <label>Logo (URL)
            <input formControlName="logo" placeholder="https://" />
            @if (showError('logo')) { <small class="err">{{ message('logo') }}</small> }
          </label>
        </div>
      }

      <button class="btn" type="submit" [disabled]="loading()">
        {{ loading() ? 'Creating account…' : 'Sign up' }}
      </button>
    </form>

    <p class="foot">Already have an account? <a routerLink="/login">Log in</a></p>
  </section>
</main>
