spring.application.name=profile-service
server.port=8082

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/profile_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA: Flyway creates the tables, Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Internal calls between services
internal.api-key=${INTERNAL_API_KEY}

# Default commission rate for new organizers (0.1000 = 10 %)
profile.default-commission-rate=0.1000